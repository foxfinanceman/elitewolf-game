<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Wolf Evolution</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🐺 ELITE WOLF</h1>
        <p class="subtitle">Raise your wolf. Build the pack.</p>

        <div class="stats-bar">
            <div class="stat">💰 <span id="coins">0</span></div>
            <div class="stat">⚡ <span id="energy">100</span>/100</div>
        </div>

        <div class="wolf-container">
            <div class="wolf">🐺</div>
        </div>

        <h2 id="stage">Wolf Pup</h2>

        <div class="xp-box">
            <div class="xp-text">
                XP: <span id="xp">0</span> / <span id="nextXP">100</span>
            </div>

            <div class="xp-bar">
                <div id="xpFill"></div>
            </div>
        </div>

        <button id="trainBtn" onclick="trainWolf()">TRAIN WOLF ⚔️</button>

        <p id="message">Your journey begins...</p>

        <!-- Visible, clearly-labeled RESET TEST button placed inside the game container
             so it's always visible at the bottom of the game UI. It calls the existing
             resetTest() function defined in script.js. We use a unique id so the
             existing temporary floating button in script.js doesn't conflict. -->
        <button id="resetTestInline" onclick="resetTest()">🔄 RESET TEST</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
